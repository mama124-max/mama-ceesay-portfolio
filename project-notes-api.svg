<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title description">
  <title id="title">Note-Taking API illustration</title>
  <desc id="description">A conceptual diagram showing REST requests sent to an Express API and responses returned as JSON.</desc>
  <rect width="520" height="360" rx="18" fill="#f0f3f1"/>
  <rect x="24" y="24" width="472" height="312" rx="12" fill="#fff" stroke="#dfe5e1"/>
  <text x="48" y="62" fill="#1e2a27" font-family="Arial, sans-serif" font-size="16" font-weight="700">NOTE-TAKING API</text>
  <text x="48" y="84" fill="#697570" font-family="Arial, sans-serif" font-size="12">REST request and response flow</text>

  <rect x="48" y="118" width="150" height="178" rx="9" fill="#f7f8f6" stroke="#dfe5e1"/>
  <text x="68" y="147" fill="#176b58" font-family="Arial, sans-serif" font-size="11" font-weight="700">HTTP REQUESTS</text>
  <rect x="66" y="164" width="114" height="25" rx="5" fill="#e9f2ed"/>
  <text x="78" y="181" fill="#105242" font-family="Consolas, monospace" font-size="11" font-weight="700">GET</text>
  <text x="111" y="181" fill="#3d4945" font-family="Consolas, monospace" font-size="10">/notes</text>
  <rect x="66" y="198" width="114" height="25" rx="5" fill="#e9f2ed"/>
  <text x="78" y="215" fill="#105242" font-family="Consolas, monospace" font-size="11" font-weight="700">POST</text>
  <text x="118" y="215" fill="#3d4945" font-family="Consolas, monospace" font-size="10">/notes</text>
  <rect x="66" y="232" width="114" height="25" rx="5" fill="#f0f3f1"/>
  <text x="78" y="249" fill="#697570" font-family="Consolas, monospace" font-size="11" font-weight="700">PUT</text>
  <text x="111" y="249" fill="#3d4945" font-family="Consolas, monospace" font-size="10">/notes/:id</text>
  <rect x="66" y="266" width="114" height="25" rx="5" fill="#f0f3f1"/>
  <text x="74" y="283" fill="#697570" font-family="Consolas, monospace" font-size="9" font-weight="700">DELETE</text>
  <text x="121" y="283" fill="#3d4945" font-family="Consolas, monospace" font-size="8">/notes/:id</text>

  <path d="M210 205h35" stroke="#176b58" stroke-linecap="round" stroke-width="2"/>
  <path d="m238 198 8 7-8 7" fill="none" stroke="#176b58" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

  <rect x="254" y="154" width="106" height="102" rx="10" fill="#e9f2ed" stroke="#c9ded3"/>
  <path d="M287 184h40m-40 12h40m-40 12h26" stroke="#176b58" stroke-linecap="round" stroke-width="2"/>
  <rect x="278" y="174" width="58" height="48" rx="5" fill="none" stroke="#176b58" stroke-width="1.5"/>
  <text x="307" y="241" fill="#105242" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXPRESS API</text>

  <path d="M372 205h30" stroke="#176b58" stroke-linecap="round" stroke-width="2"/>
  <path d="m395 198 8 7-8 7" fill="none" stroke="#176b58" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

  <rect x="410" y="154" width="62" height="102" rx="9" fill="#1e2a27"/>
  <circle cx="423" cy="170" r="2" fill="#9dc6b4"/>
  <circle cx="431" cy="170" r="2" fill="#c5ad67"/>
  <circle cx="439" cy="170" r="2" fill="#d78a78"/>
  <text x="421" y="194" fill="#9dc6b4" font-family="Consolas, monospace" font-size="9">{</text>
  <text x="430" y="210" fill="#fff" font-family="Consolas, monospace" font-size="8">"notes"</text>
  <text x="430" y="224" fill="#c5ad67" font-family="Consolas, monospace" font-size="8">: [...]</text>
  <text x="421" y="240" fill="#9dc6b4" font-family="Consolas, monospace" font-size="9">}</text>
  <text x="441" y="278" fill="#697570" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">JSON RESPONSE</text>
</svg>
