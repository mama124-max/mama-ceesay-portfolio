  <text x="431" y="202" fill="#105242" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
  <rect x="402" y="220" width="58" height="26" rx="5" fill="#f7f8f6"/>
