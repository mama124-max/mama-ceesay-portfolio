  <path d="m207 198 8 7-8 7" fill="none" stroke="#176b58" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

  <rect x="224" y="152" width="112" height="106" rx="10" fill="#e9f2ed" stroke="#c9ded3"/>
  <circle cx="280" cy="185" r="16" fill="#fff" stroke="#176b58" stroke-width="2"/>
  <circle cx="260" cy="222" r="7" fill="#176b58"/>
  <circle cx="280" cy="222" r="7" fill="#176b58"/>
  <circle cx="300" cy="222" r="7" fill="#176b58"/>
  <path d="M270 199 263 215m17-14v14m10-16 7 16" stroke="#176b58" stroke-width="1.5"/>
  <text x="280" y="278" fill="#105242" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CLASSIFICATION MODEL</text>

