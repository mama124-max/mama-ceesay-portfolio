<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title description">
  <title id="title">Student performance model illustration</title>
  <desc id="description">A conceptual diagram showing student data entering a classification model and producing a pass-or-fail prediction.</desc>
  <rect width="520" height="360" rx="18" fill="#f0f3f1"/>
  <rect x="24" y="24" width="472" height="312" rx="12" fill="#fff" stroke="#dfe5e1"/>
  <text x="48" y="62" fill="#1e2a27" font-family="Arial, sans-serif" font-size="16" font-weight="700">STUDENT PERFORMANCE</text>
  <text x="48" y="84" fill="#697570" font-family="Arial, sans-serif" font-size="12">Classification workflow</text>

  <rect x="48" y="118" width="118" height="174" rx="9" fill="#f7f8f6" stroke="#dfe5e1"/>
  <text x="64" y="146" fill="#176b58" font-family="Arial, sans-serif" font-size="11" font-weight="700">STUDENT DATA</text>
  <rect x="64" y="164" width="86" height="10" rx="5" fill="#dfe5e1"/>
  <rect x="64" y="187" width="70" height="10" rx="5" fill="#dfe5e1"/>
  <rect x="64" y="210" width="80" height="10" rx="5" fill="#dfe5e1"/>
  <rect x="64" y="233" width="58" height="10" rx="5" fill="#dfe5e1"/>
  <rect x="64" y="256" width="76" height="10" rx="5" fill="#dfe5e1"/>

